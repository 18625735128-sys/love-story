<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的故事</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
body{background:#fff5f7;color:#444;line-height:1.7}
#lock-page{position:fixed;inset:0;background:#fff5f7;display:flex;align-items:center;justify-content:center;z-index:999}
.lock-box{background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 20px #00000015;text-align:center;width:90%;max-width:400px}
.lock-box h2{color:#e86b84;margin-bottom:18px}
#pwd-input{width:100%;padding:12px;border:1px solid #f2c4cd;border-radius:8px;font-size:16px;margin-bottom:14px;outline:none}
#unlock-btn{width:100%;padding:12px;border:none;background:#e86b84;color:#fff;border-radius:8px;font-size:16px;cursor:pointer}
#main{display:none;padding:20px 16px;max-width:900px;margin:0 auto}
header{text-align:center;margin-bottom:40px}
header h1{color:#e86b84;margin-bottom:8px;font-size:26px}
.time-item{background:#fff;border-radius:12px;padding:18px;margin-bottom:20px;box-shadow:0 2px 12px #00000008}
.time-date{color:#e86b84;font-weight:bold;margin-bottom:8px;font-size:17px}
.photo-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.photo-row img{width:100%;border-radius:10px;object-fit:cover;aspect-ratio:4/3}
footer{text-align:center;margin-top:50px;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div id="lock-page">
  <div class="lock-box">
    <h2>🔐 进入我们的故事</h2>
    <input type="password" id="pwd-input" placeholder="请输入访问密码">
    <button id="unlock-btn">查看</button>
  </div>
</div>

<div id="main">
  <header>
    <h1>我们的故事</h1>
    <p>始于某个温柔的日子</p>
  </header>
  <div id="story-list"></div>
  <footer>
    <p>爱是慢慢记录，岁岁相伴</p>
  </footer>
</div>

<script>
// 页面访问密码，之后你可以在这里修改
const PASSWD = "123456";
const lockPage = document.getElementById("lock-page");
const mainPage = document.getElementById("main");
const pwdInput = document.getElementById("pwd-input");
const unlockBtn = document.getElementById("unlock-btn");
const storyWrap = document.getElementById("story-list");

unlockBtn.onclick = async ()=>{
  if(pwdInput.value === PASSWD){
    lockPage.style.display = "none";
    mainPage.style.display = "block";
    const res = await fetch("./data/stories.json");
    const list = await res.json();
    let html = "";
    list.forEach(item=>{
      let imgHtml = "";
      if(item.photos && item.photos.length>0){
        imgHtml = `<div class="photo-row">${item.photos.map(url=>`<img src="${url}" alt="合照">`).join("")}</div>`
      }
      html += `
        <div class="time-item">
          <div class="time-date">${item.date}</div>
          <p>${item.content}</p>
          ${imgHtml}
        </div>
      `
    })
    storyWrap.innerHTML = html;
  }else{
    alert("密码错误");
  }
}
</script>
</body>
</html>
