<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>张鹏振 & 王学儿 · 我们的故事</title>
<meta name="description" content="把我们的日子，一页一页收起来。" />
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="container">
  <div class="header-card">
    <h1 class="title">张鹏振 💖 王学儿</h1>
    <p class="desc">始于 2025-06-20</p>
    <p class="count-day" id="dayCount">正在计算相恋天数...</p>
  </div>

  <div class="add-btn-wrap">
    <button id="addStoryBtn">✨ 添加新故事</button>
  </div>

  <div id="storyList"></div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-wrap" id="modal">
  <div class="modal">
    <h3>写下属于我们的小故事</h3>
    <input type="text" id="storyTitle" placeholder="故事标题">
    <textarea id="storyContent" placeholder="在这里记录内容，留给以后慢慢看"></textarea>
    <input type="hidden" id="editId">
    <div class="modal-buttons">
      <button id="closeModal">取消</button>
      <button id="saveStory">保存</button>
    </div>
  </div>
</div>

<script src="assets/main.js"></script>
</body>
</html>
