backend:
  name: git-gateway
  branch: main
media_folder: "uploads"
public_folder: "uploads"
collections:
  - name: story
    label: 小故事
    folder: content/story
    create: true
    slug: "{{title}}"
    extension: md
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "日期", name: "date", widget: "date"}
      - {label: "正文内容", name: "body", widget: "markdown"}
