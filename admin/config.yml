backend:
  name: git-gateway
  branch: main
media_folder: uploads
public_folder: /uploads
collections:
  - name: story
    label: 故事
    folder: content/story
    create: true
    fields:
      - {name: title, label: 标题}
      - {name: date, label: 日期, widget: datetime}
      - {name: body, label: 正文, widget: markdown}
